<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#CE2029" />
    <title>Aniversariantes · 1ª Cia Op CBMMG</title>
    <link rel="icon" type="image/png" href="/logo-cbmmg.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Manrope: interface | Roboto: cartão de aniversário -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cbmmg: {
                red: '#CE2029',
                'red-dark': '#A8171E',
                orange: '#F5821F',
                gold: '#C59C6C',
                beige: '#F4F1EA',
                dark: '#2D2D2D',
              }
            },
            fontFamily: {
              sans: ['Manrope', 'system-ui', 'sans-serif'],
              card: ['Roboto', 'sans-serif'],
            },
            keyframes: {
              'fade-in': { from: { opacity: '0', transform: 'translateY(6px)' }, to: { opacity: '1', transform: 'none' } },
              'slide-up': { from: { opacity: '0', transform: 'translateY(14px)' }, to: { opacity: '1', transform: 'none' } },
              'scale-in': { from: { opacity: '0', transform: 'scale(.96)' }, to: { opacity: '1', transform: 'none' } },
            },
            animation: {
              'fade-in': 'fade-in .35s ease-out backwards',
              'slide-up': 'slide-up .3s cubic-bezier(.2,.8,.2,1) backwards',
              'scale-in': 'scale-in .18s ease-out backwards',
            },
          }
        }
      }
    </script>
    <style>
      body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; background: #f6f5f2; }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
      .custom-scrollbar { scrollbar-width: thin; scrollbar-color: #d6d3d1 transparent; }
      .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }

      /* Impressão do cartão (botão "Imprimir" no gerador) */
      @media print {
        @page { size: A4; margin: 0; }
        * { animation: none !important; }
        body { background: #fff !important; }
        body * { visibility: hidden; }
        #printable-card, #printable-card * { visibility: visible; }
        .print-reset { transform: none !important; overflow: visible !important; box-shadow: none !important; }
        #printable-card {
          position: fixed;
          left: 0;
          top: 0;
          margin: 0;
          padding: 0;
          transform: scale(1.3345); /* 595px → largura A4 */
          transform-origin: top left;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "html2canvas": "https://esm.sh/html2canvas@^1.4.1",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.3",
    "vite": "https://esm.sh/vite@^7.3.1"
  }
}
</script>
</head>
  <body class="bg-[#f6f5f2] text-stone-800">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
